upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;

    # Максимальный размер загружаемых файлов
    client_max_body_size 20M;

    # React статика
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Для React Router — все пути отдаём index.html
        try_files $uri $uri/ /index.html;
    }

    # Django API
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Все Django endpoints
    location ~ ^/(auth|apartments|bookings|owner|reviews|chat|my_apartments|images|media|admin|static)/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Медиафайлы — отдаём напрямую через Nginx
    location /media/ {
        alias /app/media/;
    }

    # Статика Django (admin и т.д.)
    location /static/ {
        alias /app/staticfiles/;
    }
}